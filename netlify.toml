[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "/api"
  VITE_FIREBASE_API_KEY = "AIzaSyDMxiEN8S5bTcfDZ81OZNNxOQXklBPn05k"
  VITE_FIREBASE_AUTH_DOMAIN = "jeenie-2026.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID = "jeenie-2026"
  VITE_FIREBASE_STORAGE_BUCKET = "jeenie-2026.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "212082605572"
  VITE_FIREBASE_APP_ID = "1:212082605572:web:88ff68331f1f7422f4ff51"
  VITE_FIREBASE_MEASUREMENT_ID = "G-PXQEJ72PXG"

# Secure API Reverse-Proxy to Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://jennie-your-2nd-love-music-app-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA single-page routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "autoplay=*, encrypted-media=*"
